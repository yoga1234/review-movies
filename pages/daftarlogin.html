<!doctype html>
<html>
  <head>
    <title>MOVIE REVIEW: LOGIN</title>
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.ico"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- Form Registrasi -->
    <div
      class="d-flex justify-content-center align-items-center vh-100"
      id="registerForm"
    >
      <div class="container border rounded p-3" style="max-width: 400px">
        <form>
          <div class="mb-3">
            <label for="registerUsername" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="registerUsername"
              onblur="checkRegistrationUsername()"
              required
            />
            <div class="invalid-feedback">Username tidak dapat digunakan.</div>
          </div>
          <div class="mb-3">
            <label for="registerPassword" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="registerPassword"
              onblur="checkRegistrationPassword()"
              required
            />
            <div id="passwordHelp" class="form-text">
              Gunakan kombinasi huruf besar, huruf kecil, angka, dan simbol
              minimal 8 karakter.
            </div>
          </div>
          <div class="mb-3">
            <label for="registerEmail" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="registerEmail"
              onblur="checkRegistrationEmail()"
              required
            />
            <div class="invalid-feedback">Email tidak dapat digunakan.</div>
          </div>
          <div class="justify-content-center d-flex">
            <button
              type="button"
              class="btn btn-primary"
              onclick="registerClick()"
            >
              Daftar
            </button>
          </div>
        </form>
        <div>
          Sudah punya akun?
          <a href="#" onclick="toggleForm()"> Klik untuk masuk</a>
        </div>
      </div>
    </div>
    <!-- Form Login -->
    <div
      class="d-flex justify-content-center align-items-center vh-100 d-none"
      id="loginForm"
    >
      <div class="container border rounded p-3" style="max-width: 400px">
        <form>
          <div class="mb-3">
            <label for="loginUsername" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="loginUsername"
              onblur="checkLoginUsername()"
              required
            />
          </div>
          <div class="mb-3">
            <label for="loginPassword" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="loginPassword"
              onblur="checkLoginPassword()"
              required
            />
          </div>
          <div class="justify-content-center d-flex">
            <button
              type="button"
              class="btn btn-primary"
              onclick="loginClick()"
            >
              Masuk
            </button>
          </div>
        </form>
        <div>
          Belum punya akun?
          <a href="#" onclick="toggleForm()"> Klik untuk registrasi</a>
        </div>
      </div>
    </div>

    <!-- SCRIPTS -->
    <script src="../assets/objects/moviesData.js"></script>
    <script src="..\assets\objects\userData.js"></script>
    <script src="..\assets\module\authentication.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
