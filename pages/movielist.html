<!doctype html>
<html>
  <head>
    <title>MOVIE REVIEW: Movie List</title>
    <link
      rel="shortcut icon"
      href="../assets/images/favicon.ico"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../assets/module/module.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap");

      .card {
        margin-top: 50px;
      }
      .loading-text {
        margin-top: 50px;
        font-size: 27px;
        font-family: "Montserrat", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <div class="navbar">
        <div class="left-side">MOVIE REVIEW</div>
        <div class="right-side">
          <a href="../index.html">HOME</a>
          <a href="#">MOVIE LIST</a>
          <a id="login-button" href="#">LOGIN</a>
        </div>
      </div>
    </div>
    <div style="margin-top: 50px" id="movielist-container">
      <div class="container">
        <form id="moviecarijudul" class="row g-3">
          <div class="col-auto">
            <label for="carijudul" class="visually-hidden">Password</label>
            <input
              type="text"
              class="form-control"
              id="carijudul"
              placeholder="Judul Film"
              autocomplete="off"
            />
          </div>
          <div class="col-auto">
            <button type="submit" class="btn btn-primary mb-3">
              Cari Film
            </button>
            <button
              id="search-reset-button"
              type="button"
              class="btn btn-outline-danger mb-3"
            >
              RESET
            </button>
          </div>
        </form>
        <div class="row" id="movielist-card-container"></div>
      </div>
    </div>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/objects/reviewData.js"></script>
    <script src="../assets/objects/moviesData.js"></script>
    <script src="../assets/js/movieList.js"></script>
    <script src="../assets/module/module.js"></script>
    <script src="../assets/js/loginButton.js"></script>
  </body>
</html>
