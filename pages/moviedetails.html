<!doctype html>
<html>
  <head>
    <title>MOVIE REVIEW: Movie Details</title>
    <link
      rel="shortcut icon"
      href="../assets/images/favicon.ico"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../assets/module/module.css" />
  </head>
  <body>
    <div id="header">
      <div class="navbar">
        <div class="left-side">MOVIE REVIEW</div>
        <div class="right-side">
          <a href="../index.html">HOME</a>
          <a href="./movielist.html">MOVIE LIST</a>
          <a id="login-button" href="#">LOGIN</a>
        </div>
      </div>
    </div>
    <div class="moviedetails-container">
      <!-- movie details top part start -->
      <div style="margin-top: 75px" class="container">
        <h1 class="display-6">Movie Details</h1>
        <div style="margin-top: 50px" class="row">
          <div class="col-4">
            <img
              style="width: 400px"
              src="../assets/images/monster.jpg"
              class="rounded mx-auto d-block"
              alt="Monster"
            />
            <div style="margin-top: 30px; margin-left: 7px">
              <p class="h5">Release Year :</p>
              <p style="font-weight: 300; font-size: 2rem" class="display-6">
                2025
              </p>
              <p class="h5">Director:</p>
              <p style="font-weight: 300; font-size: 2rem" class="display-6">
                John Doe
              </p>
            </div>
          </div>
          <div class="col-8">
            <h1 class="display-2">Monster</h1>
            <p style="font-weight: 300; font-size: 1.5rem" class="display-6">
              Mistery, Comedy
            </p>
            <p style="font-weight: 400; margin-top: 50px" class="h4">
              Rating: <span style="font-weight: 300">4.3</span> / 5
            </p>
            <p class="lead" style="margin-top: 10px">
              After an outburst at school involving her son, a concerned single
              mother demands answers, triggering a sequence of deepening
              suspicion and turmoil.
            </p>
            <iframe
              style="margin-top: 30px"
              width="600"
              height="315"
              src="https://www.youtube.com/embed/cOpWDxxiwoE?si=wyStRLx6_6uJXl49"
              title="YouTube video player"
              frameborder="0"
              allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share;
              "
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      </div>
      <!-- movie details top part end -->
    </div>
    <div id="footer"></div>
    <script src="../assets/module/module.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/objects/moviesData.js"></script>
    <script src="../assets/objects/reviewData.js"></script>
    <script src="../assets/js/movieDetails.js"></script>
    <script src="../assets/js/loginButton.js"></script>
  </body>
</html>
